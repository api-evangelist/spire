name: SPIRE
description: SPIRE (SPIFFE Runtime Environment) is the reference implementation of
  the SPIFFE standard, providing a toolchain for establishing trust between software
  systems across a wide variety of hosting platforms through automated attestation
  and workload identity distribution. SPIRE manages a certificate authority, performs
  node and workload attestation, and issues SVIDs to workloads through the SPIFFE
  Workload API.
