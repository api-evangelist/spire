apis:
- aid: spire:spire-workload-api
  name: SPIRE Workload API
  description: >-
    The SPIRE Agent exposes the SPIFFE Workload API as a Unix domain socket, allowing workloads running
    on the same node to request their X.509-SVIDs and JWT-SVIDs without requiring any credentials. The
    Workload API also delivers trust bundle updates so that workloads can verify the identity of other
    workloads.
  humanURL: https://spiffe.io/docs/latest/spire-about/spire-concepts/
  properties:
  - type: Documentation
    url: https://spiffe.io/docs/latest/spire-about/spire-concepts/
  - type: Reference
    url: https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE_Workload_API.md
  - type: AsyncAPI
    url: asyncapi/spire-workload-asyncapi.yml
  - type: GitHubRepository
    url: https://github.com/spiffe/spire
  - url: graphql/spire-graphql.md
    type: GraphQL
  tags:
  - gRPC
  - Identity
  - JWT
  - Workload
  - X.509
- aid: spire:spire-server-api
  name: SPIRE Server API
  description: >-
    The SPIRE Server exposes a gRPC API used by administrators and the SPIRE Agent to manage registration
    entries, node attestation, bundle federation, and server health. It allows creating and managing workload
    registration entries that define the SPIFFE IDs issued to workloads matching specified selectors,
    and supports federation with external SPIFFE trust domains.
  humanURL: https://spiffe.io/docs/latest/deploying/spire_server/
  properties:
  - type: Documentation
    url: https://spiffe.io/docs/latest/deploying/spire_server/
  - type: Reference
