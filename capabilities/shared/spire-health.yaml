naftiko: "1.0.0-alpha1"

info:
  label: "SPIRE Health Check API"
  description: >-
    SPIRE Server and SPIRE Agent health check endpoints providing liveness and
    readiness probes for Kubernetes orchestration and infrastructure monitoring.
  tags:
    - Security
    - Identity
    - Health
    - Cloud Native
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SPIRE_HOST: SPIRE_HOST
      SPIRE_PORT: SPIRE_PORT

capability:
  consumes:
    - type: http
      namespace: spire-health
      baseUri: "http://{{SPIRE_HOST}}:{{SPIRE_PORT}}"
      description: "SPIRE liveness and readiness health check endpoints."
      resources:
        - name: health
          path: /
          description: "SPIRE health check probes."
          operations:
            - name: get-liveness
              method: GET
              description: "Returns HTTP 200 if the SPIRE component process is alive."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-readiness
              method: GET
              description: "Returns HTTP 200 if the SPIRE component is ready to serve requests."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8110
      namespace: spire-health-rest
      resources:
        - path: /v1/health/live
          name: liveness
          description: "SPIRE liveness probe."
          operations:
            - method: GET
              name: get-liveness
              description: "Check if SPIRE component is alive."
              call: "spire-health.get-liveness"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/health/ready
          name: readiness
          description: "SPIRE readiness probe."
          operations:
            - method: GET
              name: get-readiness
              description: "Check if SPIRE component is ready."
              call: "spire-health.get-readiness"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9110
      namespace: spire-health-mcp
      transport: http
      tools:
        - name: check-liveness
          description: "Check if the SPIRE component process is alive and running."
          hints:
            readOnly: true
            idempotent: true
          call: "spire-health.get-liveness"
          outputParameters:
            - type: object
              mapping: "$."

        - name: check-readiness
          description: "Check if the SPIRE component is ready to serve requests."
          hints:
            readOnly: true
            idempotent: true
          call: "spire-health.get-readiness"
          outputParameters:
            - type: object
              mapping: "$."
