naftiko: "1.0.0-alpha1"

info:
  label: "SPIRE OIDC Discovery Provider API"
  description: >-
    SPIRE OIDC Discovery Provider exposing OpenID Connect discovery documents and
    JSON Web Key Sets, enabling workloads to use JWT-SVIDs with OIDC-compatible
    systems including AWS IAM, GCP, and Azure.
  tags:
    - Security
    - Identity
    - OIDC
    - Federation
    - JWT
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SPIRE_OIDC_DOMAIN: SPIRE_OIDC_DOMAIN

capability:
  consumes:
    - type: http
      namespace: spire-oidc
      baseUri: "https://{{SPIRE_OIDC_DOMAIN}}"
      description: "SPIRE OIDC Discovery Provider endpoints."
      resources:
        - name: discovery
          path: /.well-known
          description: "OpenID Connect discovery document endpoint."
          operations:
            - name: get-openid-configuration
              method: GET
              description: "Returns the OpenID Connect discovery document."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: keys
          path: /keys
          description: "JSON Web Key Set endpoint."
          operations:
            - name: get-jwks
              method: GET
              description: "Returns the JSON Web Key Set for JWT-SVID verification."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8111
      namespace: spire-oidc-rest
      resources:
        - path: /v1/oidc/discovery
          name: discovery
          description: "OpenID Connect discovery document."
          operations:
            - method: GET
              name: get-openid-configuration
              description: "Retrieve OIDC provider configuration."
              call: "spire-oidc.get-openid-configuration"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/oidc/keys
          name: keys
          description: "JSON Web Key Set for JWT-SVID verification."
          operations:
            - method: GET
              name: get-jwks
              description: "Retrieve public keys for JWT-SVID verification."
              call: "spire-oidc.get-jwks"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9111
      namespace: spire-oidc-mcp
      transport: http
      tools:
        - name: get-oidc-configuration
          description: "Retrieve the OIDC discovery document describing SPIRE's OIDC provider configuration."
          hints:
            readOnly: true
            idempotent: true
          call: "spire-oidc.get-openid-configuration"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-jwks
          description: "Retrieve the JSON Web Key Set containing public keys for verifying JWT-SVIDs."
          hints:
            readOnly: true
            idempotent: true
          call: "spire-oidc.get-jwks"
          outputParameters:
            - type: object
              mapping: "$."
